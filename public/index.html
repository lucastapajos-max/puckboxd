<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puckboxd</title>
  <meta name="description" content="Registre, avalie e comente os jogos da NHL que você assistiu.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#/" class="brand"><span class="puck" aria-hidden="true"></span>Puckboxd</a>
      <nav class="nav">
        <a href="#/">Jogos</a>
        <a href="#/comunidade">Comunidade</a>
        <label class="spoiler-toggle" title="Esconde placares dos jogos que você ainda não registrou">
          <input type="checkbox" id="spoiler-free"> Sem spoiler
        </label>
        <span id="session"></span>
      </nav>
    </div>
  </header>
  <main id="view" class="wrap" aria-live="polite"></main>
  <footer class="wrap footer">
    Dados de jogos: API pública da NHL. Projeto de fã, sem vínculo com a liga.
  </footer>
  <dialog id="log-dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
