<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puckboxd</title>
  <meta name="description" content="Registre, avalie e comente os jogos da NHL que você assistiu.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#/" class="brand"><span class="puck" aria-hidden="true"></span>Puckboxd</a>
      <nav class="nav nav-main" aria-label="Seções">
        <a href="#/">Jogos</a>
        <a href="#/feed" id="nav-feed" hidden>Seguindo</a>
        <a href="#/comunidade">Comunidade</a>
        <label class="spoiler-toggle" title="Esconde placares dos jogos que você ainda não registrou">
          <input type="checkbox" id="spoiler-free"> Sem spoiler
        </label>
      </nav>
      <div class="nav nav-actions">
        <a href="#/busca" class="search-link" aria-label="Buscar" title="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        </a>
        <a href="#/notificacoes" id="nav-bell" class="bell" hidden aria-label="Notificações" title="Notificações">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          <span id="bell-count" class="bell-count" hidden></span>
        </a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Trocar tema"></button>
        <span id="session"></span>
      </div>
    </div>
  </header>
  <main id="view" class="wrap" aria-live="polite"></main>
  <footer class="wrap footer">
    Dados de jogos: API pública da NHL. Projeto de fã, sem vínculo com a liga.
  </footer>
  <dialog id="log-dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
